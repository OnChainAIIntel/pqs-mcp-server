name: pqs-mcp-server
description: MCP server for PQS — score and optimize prompts before sending them to expensive LLMs. Free tier: 100 scores/month, no API key. Pro: $19.99/mo for prompt optimization with before/after outputs. Built on PEEM, RAGAS, MT-Bench, G-Eval, and ROUGE.
version: 1.4.0

startCommand:
  type: stdio
  command: npx
  args: ["pqs-mcp-server"]

configSchema:
  type: object
  properties:
    api_key:
      type: string
      description: "PQS Pro API key (pqs_live_xxx) for optimize_prompt. score_prompt is free and requires no key. Subscribe at promptqualityscore.com/pricing."
  required: []

capabilities:
  tools: true
